def rafiqVersion = new groovy.json.JsonSlurper().parse(rootProject.file("../src/version.json"))
apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'
android {
    namespace 'app.rafiq.personal'
    compileSdk 36
    defaultConfig {
        applicationId 'app.rafiq.personal'
        minSdk 30
        targetSdk 36
        versionCode rafiqVersion.code
        versionName rafiqVersion.name
    }
    sourceSets { main { java.srcDirs += ["../shared"] } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_21; targetCompatibility JavaVersion.VERSION_21 }
    kotlinOptions { jvmTarget = '21' }
    buildTypes { release { signingConfig signingConfigs.debug } }
}
dependencies {
    implementation 'com.google.android.gms:play-services-wearable:20.0.1'
    implementation 'androidx.health:health-services-client:1.1.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-guava:1.11.0'
    testImplementation 'junit:junit:4.13.2'
}
